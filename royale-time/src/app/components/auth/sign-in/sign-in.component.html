<div class="auth-container">
    <h2>Connexion</h2>
    <form (ngSubmit)="login()">
      <input type="email" placeholder="Email" [(ngModel)]="email" name="email" required />
      <input type="password" placeholder="Mot de passe" [(ngModel)]="password" name="password" required />
      <button type="submit">Se connecter</button>
      <p>
        Pas encore de compte ?
        <a routerLink="/sign-up">Inscrivez-vous</a>
      </p>
      
    </form>    
  </div>
