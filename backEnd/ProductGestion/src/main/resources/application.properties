




# Nom de l'application
spring.application.name=ProductGestion

# Configuration de la base de donn es (le hostname devient le nom du service dans docker-compose)
spring.datasource.url=jdbc:mysql://mysql-product:3306/ProductGestion?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password

# JPA & Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Port du microservice
server.port=8089

# Configuration Eureka
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
